<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Struktur Organisasi — Ilmu Ketak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#122347;
  --navy-2:#1a2f5c;
  --teal:#0fb3a8;
  --teal-dark:#0a8c83;
  --sky:#3c8dbc;
  --orange:#f2994a;
  --red:#e4572e;
  --mint:#eef7f5;
  --paper:#f6f8fa;
  --card:#ffffff;
  --line:#c9d6e3;
  --ink:#122347;
  --ink-soft:#5b6b82;
  --radius:14px;
  --shadow: 0 6px 18px rgba(18,35,71,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, #e7f3f4 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #eef0fb 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
}

/* ===== Top bar ===== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 26px;
  background:var(--navy);
  background-image:linear-gradient(120deg,var(--navy) 0%, var(--navy-2) 60%, #17356b 100%);
  color:#fff;
  box-shadow:0 4px 16px rgba(18,35,71,0.25);
  position:sticky;
  top:0;
  z-index:50;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand img{height:40px; width:40px; border-radius:9px; object-fit:cover; box-shadow:0 2px 8px rgba(0,0,0,0.25);}
.brand-text .title{font-family:'Poppins',sans-serif; font-weight:800; font-size:18px; letter-spacing:0.3px; line-height:1.1;}
.brand-text .sub{font-size:11.5px; color:#b9c6de; letter-spacing:2px; text-transform:uppercase;}
.topbar-actions{display:flex; gap:10px; align-items:center;}

.btn{
  border:none; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
  padding:10px 16px; border-radius:10px; display:inline-flex; align-items:center; gap:8px;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:linear-gradient(120deg,var(--teal) 0%, var(--teal-dark) 100%); color:#fff; box-shadow:0 4px 12px rgba(15,179,168,0.35);}
.btn-primary:hover{box-shadow:0 6px 16px rgba(15,179,168,0.5);}
.btn-ghost{background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.18);}
.btn-ghost:hover{background:rgba(255,255,255,0.16);}
.btn-outline{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--teal); color:var(--teal-dark);}
.btn-danger{background:#fff0ec; color:var(--red); border:1.5px solid #f6c9bb;}
.btn-danger:hover{background:#ffe2d9;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ===== Layout ===== */
.layout{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:22px;
  padding:22px;
  align-items:start;
}
@media (max-width:920px){
  .layout{grid-template-columns:1fr;}
}

.panel{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid #eef1f5;
}
.panel-header{
  padding:16px 18px 10px;
  border-bottom:1px solid #f0f2f6;
}
.panel-header h2{
  font-family:'Poppins',sans-serif;
  font-size:14.5px;
  margin:0;
  color:var(--navy);
  display:flex; align-items:center; gap:8px;
}
.panel-header .dot{width:8px; height:8px; border-radius:50%; background:var(--teal); display:inline-block;}
.panel-body{padding:16px 18px 18px;}

/* ===== Form ===== */
.field{margin-bottom:13px;}
.field label{
  display:block; font-size:12px; font-weight:600; color:var(--ink-soft);
  margin-bottom:6px; letter-spacing:.2px;
}
.field input[type=text], .field select{
  width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line);
  font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink); background:#fbfcfe;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field input[type=text]:focus, .field select:focus{
  outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(15,179,168,0.12); background:#fff;
}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

.color-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
.swatch{
  width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid #fff;
  box-shadow:0 0 0 1.5px var(--line);
}
.swatch.active{box-shadow:0 0 0 2.5px var(--navy);}

.photo-upload{
  display:flex; align-items:center; gap:12px;
}
.photo-preview{
  width:52px; height:52px; border-radius:50%; background:#eef1f6 center/cover no-repeat;
  border:2px dashed var(--line); display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); font-size:10px; text-align:center; flex-shrink:0; overflow:hidden;
}
.upload-btns{display:flex; gap:8px; flex-wrap:wrap;}
input[type=file]{display:none;}

.form-actions{display:flex; gap:10px; margin-top:6px;}
.form-actions .btn{flex:1; justify-content:center;}

/* ===== Node list ===== */
.node-list{max-height:340px; overflow-y:auto; margin-top:4px; padding-right:2px;}
.node-list::-webkit-scrollbar{width:7px;}
.node-list::-webkit-scrollbar-thumb{background:#dbe2ea; border-radius:10px;}
.node-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
  border:1px solid #f0f2f6; margin-bottom:7px; background:#fbfcfe;
}
.node-item .thumb{
  width:32px; height:32px; border-radius:50%; background:var(--sky) center/cover no-repeat;
  flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700;
}
.node-item .meta{flex:1; min-width:0;}
.node-item .meta .nm{font-size:12.5px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.node-item .meta .jb{font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.node-item .acts{display:flex; gap:5px;}
.icon-btn{
  width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  font-size:13px;
}
.icon-btn:hover{border-color:var(--teal); color:var(--teal-dark);}
.icon-btn.del:hover{border-color:var(--red); color:var(--red);}
.empty-hint{
  text-align:center; padding:24px 10px; color:var(--ink-soft); font-size:12.5px; line-height:1.6;
}

/* ===== Preview toolbar ===== */
.preview-toolbar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  padding:14px 18px; border-bottom:1px solid #f0f2f6;
}
.preview-toolbar .left{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.mini-label{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
.seg{
  display:flex; border:1.5px solid var(--line); border-radius:9px; overflow:hidden;
}
.seg button{
  border:none; background:#fff; padding:7px 12px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;
}
.seg button.active{background:var(--navy); color:#fff;}

/* ===== Canvas / Org chart ===== */
.canvas-wrap{
  padding:26px;
  overflow:auto;
}
#orgCanvas{
  min-height:420px;
  border-radius:12px;
  padding:46px 30px 40px;
  display:flex;
  justify-content:center;
  background:#ffffff;
  background-image:
    linear-gradient(#eef1f6 1px, transparent 1px),
    linear-gradient(90deg, #eef1f6 1px, transparent 1px);
  background-size:26px 26px;
}
#orgCanvas.bg-plain{background-image:none; background:#ffffff;}
#orgCanvas.bg-mint{background-image:none; background:linear-gradient(160deg,#f2fbfa 0%, #ffffff 55%);}

.canvas-header{
  position:absolute;
  opacity:0;
}

.org-title{
  text-align:center;
  margin:0 0 34px;
}
.org-title h1{
  font-family:'Poppins',sans-serif;
  font-size:24px;
  font-weight:800;
  color:var(--navy);
  margin:0 0 4px;
  letter-spacing:.3px;
}
.org-title p{
  margin:0;
  font-size:12.5px;
  color:var(--ink-soft);
  letter-spacing:2.5px;
  text-transform:uppercase;
}

/* Tree - classic connector method */
.tree, .tree ul{
  list-style:none; margin:0; padding:0;
  display:flex; justify-content:center;
}
.tree ul{margin-top:0;}
.tree li{
  display:flex; flex-direction:column; align-items:center;
  padding:36px 14px 0;
  position:relative;
}
.tree li::before{ /* vertical line up to parent */
  content:"";
  position:absolute;
  top:0; left:50%;
  width:2px; height:20px;
  background:var(--line);
}
.tree > li::before{display:none;} /* root has no incoming line */

.tree li.has-children > .connector-down{
  width:2px; height:16px; background:var(--line); margin-top:0;
}

.children-row{
  display:flex;
  position:relative;
  padding-top:0;
}
.children-row > li{padding-top:20px;}
.children-row > li::before{height:20px;}
/* horizontal bar connecting siblings: spans from center of first child to center of last child */
.children-row:not(.single) > li:first-child::after{
  content:"";
  position:absolute;
  top:0; left:50%; right:0; height:2px;
  background:var(--line);
}
.children-row:not(.single) > li:last-child::after{
  content:"";
  position:absolute;
  top:0; left:0; right:50%; height:2px;
  background:var(--line);
}
.children-row:not(.single) > li:only-child::after{
  display:none;
}
.children-row:not(.single) > li:not(:first-child):not(:last-child)::after{
  content:"";
  position:absolute;
  top:0; left:0; right:0; height:2px;
  background:var(--line);
}

/* ===== Node card ===== */
.node-card{
  width:190px;
  background:var(--card);
  border-radius:12px;
  border:1.5px solid #e7ebf1;
  box-shadow:0 4px 14px rgba(18,35,71,0.07);
  padding:16px 12px 14px;
  text-align:center;
  position:relative;
  z-index:2;
}
.node-card .topbar-accent{
  position:absolute; top:0; left:14px; right:14px; height:4px; border-radius:0 0 6px 6px;
}
.node-card .photo{
  width:56px; height:56px; border-radius:50%; margin:6px auto 10px;
  background:var(--sky) center/cover no-repeat;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:18px;
  border:3px solid #fff; box-shadow:0 0 0 2px currentColor;
}
.node-card .nm{
  font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; color:var(--navy);
  line-height:1.25; margin-bottom:3px;
}
.node-card .jb{
  font-size:11.5px; color:var(--ink-soft); font-weight:500; line-height:1.3;
}

.empty-canvas{
  text-align:center; color:var(--ink-soft); padding:80px 20px; font-size:13.5px; line-height:1.7;
}
.empty-canvas b{color:var(--navy);}

footer.credit{
  text-align:center; font-size:11px; color:#9aa7ba; padding:18px 0 26px;
}
</style>
</head>

<div class="layout">

  <!-- ===== LEFT: Form + list ===== -->
  <div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-header"><h2><span class="dot"></span>Judul Struktur</h2></div>
      <div class="panel-body">
        <div class="field">
          <label>Nama Organisasi</label>
          <input type="text" id="orgName" value="Ilmu Ketak">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Sub-judul</label>
          <input type="text" id="orgSub" value="Struktur Organisasi &amp; Kepengurusan">
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-header"><h2><span class="dot"></span>Tambah / Edit Anggota</h2></div>
      <div class="panel-body">
        <div class="field">
          <label>Nama Lengkap</label>
          <input type="text" id="fName" placeholder="cth. Feriawan">
        </div>
        <div class="field">
          <label>Jabatan / Posisi</label>
          <input type="text" id="fJabatan" placeholder="cth. Ketua Umum">
        </div>
        <div class="field">
          <label>Atasan (Parent)</label>
          <select id="fParent">
            <option value="">— Tidak ada (jadi puncak) —</option>
          </select>
        </div>

        <div class="field">
          <label>Warna Aksen Kartu</label>
          <div class="color-row" id="colorRow"></div>
        </div>

        <div class="field">
          <label>Foto (opsional)</label>
          <div class="photo-upload">
            <div class="photo-preview" id="photoPreview">Tanpa foto</div>
            <div class="upload-btns">
              <button class="btn btn-outline btn-sm" id="btnUpload" type="button">Unggah foto</button>
              <button class="btn btn-danger btn-sm" id="btnRemovePhoto" type="button">Hapus</button>
            </div>
            <input type="file" id="fPhoto" accept="image/*">
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-outline" id="btnCancelEdit" type="button" style="display:none;">Batal</button>
          <button class="btn btn-primary" id="btnAdd" type="button">+ Tambah ke Struktur</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2><span class="dot"></span>Daftar Anggota <span id="countBadge" style="color:var(--ink-soft); font-weight:500;"></span></h2></div>
      <div class="panel-body">
        <div class="node-list" id="nodeList"></div>
      </div>
    </div>
  </div>

  <!-- ===== RIGHT: Preview ===== -->
  <div class="panel">
    <div class="preview-toolbar">
      <div class="left">
        <span class="mini-label">Pratinjau langsung</span>
      </div>
      <div class="left">
        <span class="mini-label">Latar:</span>
        <div class="seg" id="bgSeg">
          <button data-bg="grid" class="active">Grid</button>
          <button data-bg="plain">Polos</button>
          <button data-bg="mint">Mint</button>
        </div>
      </div>
    </div>
    <div class="canvas-wrap">
      <div id="orgCanvas">
        <!-- rendered tree goes here -->
      </div>
    </div>
  </div>

</div>

<footer class="credit">Dibuat untuk Ilmu Ketak · Struktur Organisasi Builder</footer>

<script>
(function(){
  "use strict";

  // ===== State =====
  const ACCENTS = [
    {name:'Navy',  val:'#122347'},
    {name:'Teal',  val:'#0fb3a8'},
    {name:'Sky',   val:'#3c8dbc'},
    {name:'Orange',val:'#f2994a'},
    {name:'Red',   val:'#e4572e'},
    {name:'Ungu',  val:'#8e6fd6'},
  ];

  let nodes = [];      // {id, name, jabatan, parentId, photo, color}
  let editingId = null;
  let currentColor = ACCENTS[0].val;
  let currentPhoto = null;
  let idCounter = 1;

  const STORAGE_KEY = 'ilmuketak_orgchart_v1';

  // ===== DOM refs =====
  const $ = (sel) => document.querySelector(sel);
  const orgName = $('#orgName');
  const orgSub = $('#orgSub');
  const fName = $('#fName');
  const fJabatan = $('#fJabatan');
  const fParent = $('#fParent');
  const fPhoto = $('#fPhoto');
  const photoPreview = $('#photoPreview');
  const btnUpload = $('#btnUpload');
  const btnRemovePhoto = $('#btnRemovePhoto');
  const btnAdd = $('#btnAdd');
  const btnCancelEdit = $('#btnCancelEdit');
  const nodeList = $('#nodeList');
  const countBadge = $('#countBadge');
  const orgCanvas = $('#orgCanvas');
  const colorRow = $('#colorRow');
  const bgSeg = $('#bgSeg');
  const btnExport = $('#btnExport');
  const btnReset = $('#btnReset');

  // ===== Init color swatches =====
  function renderSwatches(){
    colorRow.innerHTML = '';
    ACCENTS.forEach(c=>{
      const el = document.createElement('div');
      el.className = 'swatch' + (c.val === currentColor ? ' active' : '');
      el.style.background = c.val;
      el.title = c.name;
      el.addEventListener('click', ()=>{
        currentColor = c.val;
        renderSwatches();
      });
      colorRow.appendChild(el);
    });
  }

  // ===== Photo upload =====
  btnUpload.addEventListener('click', ()=> fPhoto.click());
  fPhoto.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      currentPhoto = ev.target.result;
      photoPreview.style.backgroundImage = `url(${currentPhoto})`;
      photoPreview.textContent = '';
    };
    reader.readAsDataURL(file);
  });
  btnRemovePhoto.addEventListener('click', ()=>{
    currentPhoto = null;
    fPhoto.value = '';
    photoPreview.style.backgroundImage = 'none';
    photoPreview.textContent = 'Tanpa foto';
  });

  function resetForm(){
    fName.value = '';
    fJabatan.value = '';
    fParent.value = '';
    currentPhoto = null;
    currentColor = ACCENTS[0].val;
    fPhoto.value = '';
    photoPreview.style.backgroundImage = 'none';
    photoPreview.textContent = 'Tanpa foto';
    renderSwatches();
    editingId = null;
    btnAdd.textContent = '+ Tambah ke Struktur';
    btnCancelEdit.style.display = 'none';
  }

  // ===== Parent dropdown =====
  function refreshParentOptions(){
    const prevVal = fParent.value;
    fParent.innerHTML = '<option value="">— Tidak ada (jadi puncak) —</option>';
    nodes.forEach(n=>{
      if(editingId && n.id === editingId) return; // can't be own parent
      const opt = document.createElement('option');
      opt.value = n.id;
      opt.textContent = `${n.name}${n.jabatan ? ' — ' + n.jabatan : ''}`;
      fParent.appendChild(opt);
    });
    if([...fParent.options].some(o=>o.value === prevVal)) fParent.value = prevVal;
  }

  // ===== Add / Save =====
  btnAdd.addEventListener('click', ()=>{
    const name = fName.value.trim();
    const jabatan = fJabatan.value.trim();
    if(!name){
      fName.focus();
      fName.style.borderColor = 'var(--red)';
      setTimeout(()=> fName.style.borderColor = '', 900);
      return;
    }
    const parentId = fParent.value || null;

    if(editingId){
      const n = nodes.find(x=>x.id === editingId);
      n.name = name; n.jabatan = jabatan; n.parentId = parentId;
      n.photo = currentPhoto; n.color = currentColor;
    } else {
      nodes.push({
        id: 'n' + (idCounter++),
        name, jabatan, parentId,
        photo: currentPhoto,
        color: currentColor
      });
    }
    save();
    resetForm();
    refreshParentOptions();
    renderList();
    renderTree();
  });

  btnCancelEdit.addEventListener('click', resetForm);

  function startEdit(id){
    const n = nodes.find(x=>x.id === id);
    if(!n) return;
    editingId = id;
    fName.value = n.name;
    fJabatan.value = n.jabatan;
    currentPhoto = n.photo;
    currentColor = n.color || ACCENTS[0].val;
    if(currentPhoto){
      photoPreview.style.backgroundImage = `url(${currentPhoto})`;
      photoPreview.textContent = '';
    } else {
      photoPreview.style.backgroundImage = 'none';
      photoPreview.textContent = 'Tanpa foto';
    }
    renderSwatches();
    refreshParentOptions();
    fParent.value = n.parentId || '';
    btnAdd.textContent = '✓ Simpan Perubahan';
    btnCancelEdit.style.display = 'inline-flex';
    window.scrollTo({top:0, behavior:'smooth'});
    fName.focus();
  }

  function deleteNode(id){
    // reassign children of deleted node to its parent, then remove
    const target = nodes.find(x=>x.id===id);
    if(!target) return;
    if(!confirm(`Hapus "${target.name}" dari struktur?`)) return;
    nodes.forEach(n=>{ if(n.parentId === id) n.parentId = target.parentId; });
    nodes = nodes.filter(n=>n.id !== id);
    if(editingId === id) resetForm();
    save();
    refreshParentOptions();
    renderList();
    renderTree();
  }

  // ===== Render list (left sidebar) =====
  function initials(name){
    return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }

  function renderList(){
    countBadge.textContent = nodes.length ? `(${nodes.length})` : '';
    if(!nodes.length){
      nodeList.innerHTML = `<div class="empty-hint">Belum ada anggota.<br>Isi form di atas lalu klik <b>Tambah ke Struktur</b>.</div>`;
      return;
    }
    nodeList.innerHTML = '';
    nodes.forEach(n=>{
      const item = document.createElement('div');
      item.className = 'node-item';
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.style.background = n.color || ACCENTS[0].val;
      if(n.photo){
        thumb.style.backgroundImage = `url(${n.photo})`;
        thumb.textContent = '';
      } else {
        thumb.textContent = initials(n.name);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `<div class="nm">${escapeHtml(n.name)}</div><div class="jb">${escapeHtml(n.jabatan||'—')}</div>`;
      const acts = document.createElement('div');
      acts.className = 'acts';
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.textContent = '✎';
      editBtn.title = 'Edit';
      editBtn.addEventListener('click', ()=>startEdit(n.id));
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn del';
      delBtn.textContent = '✕';
      delBtn.title = 'Hapus';
      delBtn.addEventListener('click', ()=>deleteNode(n.id));
      acts.appendChild(editBtn);
      acts.appendChild(delBtn);
      item.appendChild(thumb);
      item.appendChild(meta);
      item.appendChild(acts);
      nodeList.appendChild(item);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ===== Render tree (canvas preview) =====
  function buildTree(){
    const map = {};
    nodes.forEach(n => map[n.id] = {...n, children:[]});
    const roots = [];
    nodes.forEach(n=>{
      if(n.parentId && map[n.parentId]){
        map[n.parentId].children.push(map[n.id]);
      } else {
        roots.push(map[n.id]);
      }
    });
    return roots;
  }

  function nodeCardHTML(n){
    const photoInner = n.photo
      ? `style="background-image:url(${n.photo})"`
      : '';
    const photoText = n.photo ? '' : initials(n.name);
    return `
      <div class="node-card">
        <div class="topbar-accent" style="background:${n.color || ACCENTS[0].val}"></div>
        <div class="photo" ${photoInner} style="color:${n.color || ACCENTS[0].val}">${photoText}</div>
        <div class="nm">${escapeHtml(n.name)}</div>
        <div class="jb">${escapeHtml(n.jabatan || '')}</div>
      </div>
    `;
  }

  function renderNodeLi(n){
    const hasChildren = n.children && n.children.length > 0;
    let childrenHtml = '';
    if(hasChildren){
      const rowClass = n.children.length === 1 ? 'children-row single' : 'children-row';
      childrenHtml = `
        <div class="connector-down"></div>
        <ul class="${rowClass}">
          ${n.children.map(c=>renderNodeLi(c)).join('')}
        </ul>
      `;
    }
    return `<li class="${hasChildren?'has-children':''}">${nodeCardHTML(n)}${childrenHtml}</li>`;
  }

  function renderTree(){
    const title = orgName.value.trim() || 'Struktur Organisasi';
    const sub = orgSub.value.trim();
    const roots = buildTree();

    let bodyHtml = `<div class="org-title"><h1>${escapeHtml(title)}</h1>${sub ? `<p>${escapeHtml(sub)}</p>` : ''}</div>`;

    if(!roots.length){
      bodyHtml += `<div class="empty-canvas">Belum ada data struktur.<br><b>Tambahkan anggota</b> lewat panel di sebelah kiri untuk mulai membangun bagan.</div>`;
    } else {
      bodyHtml += `<ul class="tree">${roots.map(r=>renderNodeLi(r)).join('')}</ul>`;
    }
    orgCanvas.innerHTML = bodyHtml;
  }

  orgName.addEventListener('input', ()=>{ renderTree(); save(); });
  orgSub.addEventListener('input', ()=>{ renderTree(); save(); });

  // ===== Background toggle =====
  bgSeg.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    [...bgSeg.children].forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    orgCanvas.classList.remove('bg-plain','bg-mint');
    const mode = btn.dataset.bg;
    if(mode === 'plain') orgCanvas.classList.add('bg-plain');
    if(mode === 'mint') orgCanvas.classList.add('bg-mint');
  });

  // ===== Export PNG =====
  btnExport.addEventListener('click', ()=>{
    btnExport.disabled = true;
    const originalText = btnExport.textContent;
    btnExport.textContent = 'Memproses…';
    // temporarily widen wrap so nothing is clipped
    const wrap = document.querySelector('.canvas-wrap');
    const prevOverflow = wrap.style.overflow;
    wrap.style.overflow = 'visible';

    html2canvas(orgCanvas, {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true
    }).then(canvas=>{
      const link = document.createElement('a');
      const fname = (orgName.value.trim() || 'struktur-organisasi').toLowerCase().replace(/\s+/g,'-');
      link.download = `${fname}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(err=>{
      alert('Gagal mengekspor gambar: ' + err.message);
    }).finally(()=>{
      wrap.style.overflow = prevOverflow;
      btnExport.disabled = false;
      btnExport.textContent = originalText;
    });
  });

  // ===== Reset all =====
  btnReset.addEventListener('click', ()=>{
    if(!confirm('Hapus semua data struktur organisasi? Tindakan ini tidak bisa dibatalkan.')) return;
    nodes = [];
    idCounter = 1;
    resetForm();
    refreshParentOptions();
    renderList();
    renderTree();
    localStorage.removeItem(STORAGE_KEY);
  });

  // ===== Persistence (localStorage) =====
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        nodes, idCounter,
        orgName: orgName.value, orgSub: orgSub.value
      }));
    }catch(e){ /* storage may be unavailable, ignore */ }
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return seedDemo();
      const data = JSON.parse(raw);
      nodes = data.nodes || [];
      idCounter = data.idCounter || (nodes.length + 1);
      if(data.orgName !== undefined) orgName.value = data.orgName;
      if(data.orgSub !== undefined) orgSub.value = data.orgSub;
    }catch(e){ seedDemo(); }
  }

  function seedDemo(){
    nodes = [
      {id:'n1', name:'Feriawan', jabatan:'Ketua Umum', parentId:null, photo:null, color:'#122347'},
      {id:'n2', name:'Nama Wakil', jabatan:'Wakil Ketua', parentId:'n1', photo:null, color:'#0fb3a8'},
      {id:'n3', name:'Nama Sekretaris', jabatan:'Sekretaris', parentId:'n1', photo:null, color:'#3c8dbc'},
      {id:'n4', name:'Nama Bendahara', jabatan:'Bendahara', parentId:'n1', photo:null, color:'#f2994a'},
    ];
    idCounter = 5;
  }

  // ===== Boot =====
  renderSwatches();
  load();
  refreshParentOptions();
  renderList();
  renderTree();

})();
</script>
</body>
</html>
